name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: contabo
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bread_king_test
          POSTGRES_USER: bread_king
          POSTGRES_PASSWORD: bread_king
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bread_king -d bread_king_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_HOST_TEST: localhost
      DB_PORT: "5432"
      DB_NAME: bread_king
      DB_NAME_TEST: bread_king_test
      DB_USER: bread_king
      DB_PASSWORD: bread_king
      JWT_SECRET: ci-test-secret
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: contabo
    concurrency:
      group: deploy-contabo
      cancel-in-progress: false
    env:
      IMAGE: farmamad-api
      CONTAINER: farmamad-api
      NETWORK: strixcryptoapp
      HOST_PORT: "3002"
    steps:
      - uses: actions/checkout@v4

      - name: Write environment file
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'PORT=%s\n' "3001"
            printf 'NODE_ENV=%s\n' "production"
            printf 'LOG_LEVEL=%s\n' "info"
            printf 'NO_COLOR=%s\n' "1"
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=%s\n' "$DB_PORT"
            printf 'DB_NAME=%s\n' "$DB_NAME"
            printf 'DB_USER=%s\n' "$DB_USER"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_EXPIRES_IN=%s\n' "$JWT_EXPIRES_IN"
            printf 'GMAIL_USERNAME=%s\n' "$GMAIL_USERNAME"
            printf 'GMAIL_TOKEN=%s\n' "$GMAIL_TOKEN"
          } > "$RUNNER_TEMP/farmamad.env"

      - name: Build image
        run: |
          set -euo pipefail
          docker build \
            --build-arg VERSION="${{ github.ref_name }}" \
            -t "$IMAGE:${{ github.ref_name }}" \
            -t "$IMAGE:latest" .
          docker run --rm --env-file "$RUNNER_TEMP/farmamad.env" --network "$NETWORK" \
            "$IMAGE:${{ github.ref_name }}" npm run db:migrate
          docker run --rm --env-file "$RUNNER_TEMP/farmamad.env" --network "$NETWORK" \
            "$IMAGE:${{ github.ref_name }}" npx sequelize-cli db:seed:all

      - name: Recreate container
        run: |
          set -euo pipefail
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            --env-file "$RUNNER_TEMP/farmamad.env" \
            --network "$NETWORK" \
            -p "127.0.0.1:${HOST_PORT}:3001" \
            "$IMAGE:${{ github.ref_name }}"

      - name: Healthcheck
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${HOST_PORT}/health"; then
              echo "Deployment successful!"
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 "$CONTAINER"
          exit 1

      - name: Remove environment file
        if: always()
        run: rm -f "$RUNNER_TEMP/farmamad.env"
